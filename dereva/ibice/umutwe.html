<script>
  // ============================================
  // HEADER SCRIPT - FIXED FOR MOBILE MENU
  // ============================================
  (function() {
    // Function to initialize header
    function initHeader() {
      console.log('🚀 Initializing header with mobile menu...');
      
      // Get elements
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const mobileNavOverlay = document.getElementById('mobileNavOverlay');
      const mobileNavClose = document.getElementById('mobileNavClose');
      
      // Check if elements exist
      if (!mobileMenuBtn) {
        console.error('❌ mobileMenuBtn not found!');
        return;
      }
      
      if (!mobileNavOverlay) {
        console.error('❌ mobileNavOverlay not found!');
        return;
      }
      
      console.log('✅ Header elements found, attaching events...');
      
      // Force display for mobile
      if (window.innerWidth < 1024) {
        mobileMenuBtn.style.display = 'flex';
      }
      
      // Toggle menu function
      function toggleMenu(show) {
        if (show === undefined) {
          // Toggle
          const isActive = mobileNavOverlay.classList.contains('active');
          if (isActive) {
            mobileNavOverlay.classList.remove('active');
            mobileMenuBtn.classList.remove('active');
            document.body.style.overflow = '';
          } else {
            mobileNavOverlay.classList.add('active');
            mobileMenuBtn.classList.add('active');
            document.body.style.overflow = 'hidden';
          }
        } else {
          // Set specific state
          if (show) {
            mobileNavOverlay.classList.add('active');
            mobileMenuBtn.classList.add('active');
            document.body.style.overflow = 'hidden';
          } else {
            mobileNavOverlay.classList.remove('active');
            mobileMenuBtn.classList.remove('active');
            document.body.style.overflow = '';
          }
        }
      }
      
      // Open menu when clicking hamburger button
      mobileMenuBtn.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        console.log('📱 Mobile menu button clicked');
        toggleMenu();
      };
      
      // Close menu with close button
      if (mobileNavClose) {
        mobileNavClose.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          console.log('❌ Close button clicked');
          toggleMenu(false);
        };
      }
      
      // Close menu when clicking on any mobile nav link
      const mobileNavLinks = document.querySelectorAll('.mobile-nav-item');
      for (let i = 0; i < mobileNavLinks.length; i++) {
        mobileNavLinks[i].onclick = function(e) {
          console.log('🔗 Mobile nav link clicked');
          // Close menu after a short delay
          setTimeout(function() {
            toggleMenu(false);
          }, 100);
        };
      }
      
      // Close menu when clicking outside (on overlay background)
      mobileNavOverlay.onclick = function(e) {
        if (e.target === mobileNavOverlay) {
          console.log('👆 Clicked on overlay background');
          toggleMenu(false);
        }
      };
      
      // Handle window resize
      window.onresize = function() {
        if (window.innerWidth >= 1024) {
          // Desktop mode - hide mobile menu if open
          toggleMenu(false);
          mobileMenuBtn.style.display = 'none';
        } else {
          // Mobile mode - show hamburger
          mobileMenuBtn.style.display = 'flex';
        }
      };
      
      // Initial resize check
      if (window.innerWidth >= 1024) {
        mobileMenuBtn.style.display = 'none';
      } else {
        mobileMenuBtn.style.display = 'flex';
      }
      
      console.log('✅ Mobile menu initialized successfully');
    }

    // Check if user is logged in
    function checkUserLogin() {
      try {
        // Check if Firebase is available
        if (typeof firebase !== 'undefined' && firebase.auth) {
          firebase.auth().onAuthStateChanged(function(user) {
            const headerAuthSection = document.getElementById('headerAuthSection');
            const mobileLoginItem = document.getElementById('mobileLoginItem');
            
            if (headerAuthSection) {
              if (user) {
                // User is logged in - show user info
                const displayName = user.displayName || (user.email ? user.email.split('@')[0] : 'Umukoresha');
                const initial = displayName.charAt(0).toUpperCase();
                
                headerAuthSection.innerHTML = `
                  <div class="user-info">
                    <div class="user-avatar">${initial}</div>
                    <span class="user-name">${displayName}</span>
                    <div class="user-menu">
                      <button onclick="window.location.href='/dereva/dashboard.html'" title="Dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                      </button>
                      <button onclick="firebase.auth().signOut().then(() => window.location.reload())" title="Sohoka">
                        <i class="fas fa-sign-out-alt"></i>
                      </button>
                    </div>
                  </div>
                `;

                // Update mobile menu login item
                if (mobileLoginItem) {
                  mobileLoginItem.innerHTML = `
                    <i class="fas fa-user"></i>
                    <span>Konti yanjye</span>
                  `;
                  mobileLoginItem.href = '/dereva/dashboard.html';
                }
              } else {
                // User is not logged in - show login button
                headerAuthSection.innerHTML = `
                  <a href="/dereva/auth/auth.html" class="login-cta">
                    <i class="fas fa-car"></i>
                    <span>Injira / Iyandikishe</span>
                  </a>
                `;

                // Update mobile menu login item
                if (mobileLoginItem) {
                  mobileLoginItem.innerHTML = `
                    <i class="fas fa-car"></i>
                    <span>Injira / Iyandikishe</span>
                  `;
                  mobileLoginItem.href = '/dereva/auth/auth.html';
                }
              }
            }
          });
        } else {
          console.log('Firebase not loaded, using static login button');
        }
      } catch (error) {
        console.error('Error checking user login:', error);
      }
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        initHeader();
        checkUserLogin();
      });
    } else {
      // DOM already loaded
      initHeader();
      checkUserLogin();
    }

    // Also initialize after a short delay to ensure everything is loaded
    setTimeout(function() {
      console.log('⏰ Delayed header initialization check...');
      // Check if menu is working
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      if (mobileMenuBtn && !mobileMenuBtn._initialized) {
        console.log('🔄 Re-initializing header...');
        initHeader();
        mobileMenuBtn._initialized = true;
      }
    }, 500);
  })();
</script>
